name: Patch participant name into Pinal Module 1

on:
  push:
    branches:
      - pinal-participant-name-2026-09-10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pinal-participant-name-2026-09-10
          fetch-depth: 0
      - name: Add participant name capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<main><div class="wrap">\n <section class="panel" id="onet">'
          panel='''<main><div class="wrap">\n <section class="panel" id="participantName">\n  <div class="stepTag">Step 0 • Your BOOST record</div>\n  <h2>What name should appear on your BOOST reports?</h2>\n  <p class="sub">Enter your full name once. BOOST will carry it forward to your Career Decision Report, Career Coach Summary, and future personalized outputs.</p>\n  <div class="searchWrap"><input class="searchInput" id="participantFullName" type="text" autocomplete="name" placeholder="Full name" aria-label="Full name" required></div>\n  <div class="status" id="participantNameStatus" style="display:none;margin-top:10px"></div>\n </section>\n <section class="panel" id="onet">'''
          if 'id="participantFullName"' not in s:
              if anchor not in s: raise SystemExit('Module 1 main anchor not found')
              s=s.replace(anchor,panel,1)
          script='<script src="assets/module1-participant-name-v1.js"></script>'
          if script not in s:
              marker='<script src="assets/module1-search-hotfix.js"></script>'
              if marker not in s: raise SystemExit('Script marker not found')
              s=s.replace(marker,marker+'\n'+script,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Capture participant name in Module 1"
          git push origin HEAD:pinal-participant-name-2026-09-10
